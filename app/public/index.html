<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Ticket Booking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-main: #0a0e27;
            --bg-secondary: #131836;
            --bg-card: #1a1f42;
            --bg-card-hover: #222856;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --border-color: #2d3561;
            --gradient-primary: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            --gradient-button: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --gradient-button-hover: linear-gradient(135deg, #2563eb, #7c3aed, #db2777);
            --shadow-glow: 0 0 30px rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            background-image: 
                radial-gradient(ellipse at top left, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at center, rgba(236, 72, 153, 0.05) 0%, transparent 70%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2.5rem;
            background: linear-gradient(135deg, rgba(26, 31, 66, 0.8), rgba(34, 40, 86, 0.8));
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gradient-primary);
        }
        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }
        header p { color: var(--text-secondary); font-size: 1.1rem; }

        /* Logout Button */
        .logout-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            width: auto;
        }
        .logout-btn:hover {
            background: var(--accent-red);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        /* Cards Grid */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .event-card {
            background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .event-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .event-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-purple);
            box-shadow: var(--shadow-glow), 0 20px 50px rgba(0,0,0,0.4);
        }
        .event-card:hover::before { opacity: 1; }

        .event-header { margin-bottom: 1.5rem; }
        
        .event-category {
            display: inline-block;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cat-education { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .cat-technology { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .cat-workshop { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .cat-default { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }

        .event-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary); }
        .event-date { color: var(--text-secondary); font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
        .event-date::before { content: '📅'; }

        .countdown {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            padding: 1.2rem;
            border-radius: 14px;
            text-align: center;
            margin: 1.5rem 0;
            border: 1px solid rgba(139, 92, 246, 0.2);
            position: relative;
        }
        .countdown::before {
            content: '⏱️';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 0 8px;
            font-size: 1.2rem;
        }
        .countdown-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.3rem; }
        .countdown-time { font-size: 1.8rem; font-weight: 800; color: var(--text-primary); font-variant-numeric: tabular-nums; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .event-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color); }
        .event-price { font-size: 1.5rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .event-seats { font-size: 0.85rem; color: var(--text-secondary); }
        .event-seats strong { color: var(--accent-cyan); }

        /* Buttons & Forms */
        button {
            background: var(--gradient-button);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        button:hover::before { left: 100%; }
        button:hover { background: var(--gradient-button-hover); transform: translateY(-3px); box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4); }
        button:active { transform: translateY(-1px); }

        .card { 
            background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
            padding: 2.5rem; 
            border-radius: 20px; 
            border: 1px solid var(--border-color); 
            max-width: 500px; 
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gradient-primary);
            border-radius: 20px 20px 0 0;
        }
        .card h2 { 
            margin-bottom: 1.5rem; 
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
        }
        .card h2::before { margin-right: 0.5rem; }
        input, select {
            width: 100%; padding: 1rem 1.2rem; margin-bottom: 1rem;
            background: var(--bg-main); border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-primary); font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        input::placeholder { color: var(--text-secondary); }

        /* Admin Table */
        .admin-card { max-width: 100% !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; background: var(--bg-main); border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); }
        th, td { padding: 1rem 1.2rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { 
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2)); 
            color: var(--accent-cyan); 
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        td { color: var(--text-primary); }
        tr:hover td { background: rgba(139, 92, 246, 0.05); }
        tr:last-child td { border-bottom: none; }

        /* Toast Notification */
        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            color: var(--text-primary);
            padding: 1.2rem 2rem; border-radius: 14px; 
            border: 1px solid var(--accent-red);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            opacity: 0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1000;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { border-color: var(--accent-green); box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2); }
        .toast.error { border-color: var(--accent-red); box-shadow: 0 20px 40px rgba(239, 68, 68, 0.2); }

        .hidden { display: none !important; }

        /* User Info Badge */
        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent-purple);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-purple);
            margin-top: 1rem;
        }
        .user-badge.admin {
            background: rgba(236, 72, 153, 0.2);
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }

        /* Section Titles */
        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .events-grid { grid-template-columns: 1fr; }
            .logout-btn { position: static; margin-top: 1rem; width: auto; display: inline-block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎟️ DevOps Ticket Booking</h1>
            <p>Secure, Automated, and Scalable Event Management</p>
            <div id="user-info" class="hidden"></div>
            <button id="logout-btn" class="logout-btn hidden" onclick="logout()">🚪 Logout</button>
        </header>

        <!-- LOGIN -->
        <div id="login-section" class="card">
            <h2>🔐 Secure Login</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.8;">
                <i>👤 User: <b style="color: var(--accent-cyan);">user</b> / <b style="color: var(--accent-cyan);">password123</b></i><br>
                <i>️ Admin: <b style="color: var(--accent-pink);">admin</b> / <b style="color: var(--accent-pink);">password123</b></i>
            </p>
            <input type="text" id="username" placeholder="👤 Username">
            <input type="password" id="password" placeholder=" Password">
            <button onclick="login()">✨ Access Dashboard</button>
            <div id="login-msg" style="margin-top: 1rem; text-align: center;"></div>
        </div>

        <!-- BOOKING -->
        <div id="booking-section" class="hidden">
            <h2 class="section-title"> Upcoming Events</h2>
            <div id="events-list" class="events-grid">Loading events...</div>
            
            <div class="card" style="margin-top: 3rem;">
                <h2>🎟️ Reserve Your Seat</h2>
                <select id="event-select"></select>
                <input type="text" id="booker-name" placeholder="👤 Full Name">
                <input type="email" id="booker-email" placeholder="📧 Email Address">
                <button onclick="bookTicket()">✅ Confirm Booking</button>
                <div id="booking-msg" style="margin-top: 1rem; text-align: center;"></div>
            </div>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="admin-section" class="hidden" style="margin-top: 3rem;">
            <div class="card admin-card">
                <h2>🛡️ Admin Dashboard</h2>
                <button onclick="loadAdminData()" style="width: auto; margin-bottom: 1rem; padding: 0.8rem 1.5rem;">🔄 Refresh Data</button>
                <div id="admin-view"></div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast" class="toast"></div>

    <script>
        let authToken = '';
        let currentUser = '';
        let userRole = '';

        // --- TOAST NOTIFICATION SYSTEM ---
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.className = 'toast', 4000);
        }

        // --- AUTHENTICATION ---
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                authToken = data.token;
                currentUser = data.username;
                userRole = data.role;
                
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('booking-section').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                
                // Show user badge
                const userInfo = document.getElementById('user-info');
                userInfo.className = `user-badge ${data.role === 'admin' ? 'admin' : ''}`;
                userInfo.innerHTML = `${data.role === 'admin' ? '🛡️' : ''} ${data.username} (${data.role})`;
                userInfo.classList.remove('hidden');
                
                if (data.role === 'admin') document.getElementById('admin-section').classList.remove('hidden');
                loadEvents();
                showToast(`Welcome back, ${data.username}! 🎉`, 'success');
            } else {
                showToast(data.error, 'error');
            }
        }

        // --- LOGOUT ---
        function logout() {
            authToken = '';
            currentUser = '';
            userRole = '';
            
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('booking-section').classList.add('hidden');
            document.getElementById('admin-section').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
            
            // Clear form fields
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('booker-name').value = '';
            document.getElementById('booker-email').value = '';
            
            showToast('Logged out successfully ', 'success');
        }

        // --- LOAD EVENTS & COUNTDOWN ---
        async function loadEvents() {
            const res = await fetch('/api/events');
            const data = await res.json();
            const list = document.getElementById('events-list');
            const select = document.getElementById('event-select');
            
            list.innerHTML = '';
            select.innerHTML = '<option value="">-- Select an Event --</option>';
            
            data.data.forEach(event => {
                const catClass = event.category ? `cat-${event.category.toLowerCase()}` : 'cat-default';
                
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="event-header">
                        <span class="event-category ${catClass}">${event.category || 'General'}</span>
                        <div class="event-title">${event.name}</div>
                        <div class="event-date">${event.date}</div>
                    </div>
                    <div class="countdown">
                        <div class="countdown-label">Starts In</div>
                        <div class="countdown-time" id="timer-${event.id}">Calculating...</div>
                    </div>
                    <div class="event-footer">
                        <div>
                            <div class="event-price">$${event.price || 0}</div>
                            <div class="event-seats"><strong>${event.availableSeats || 0}</strong> seats left</div>
                        </div>
                    </div>
                `;
                list.appendChild(card);

                select.innerHTML += `<option value="${event.id}">${event.name} - $${event.price || 0} (${event.availableSeats || 0} left)</option>`;
            });

            startCountdowns(data.data);
        }

        function startCountdowns(events) {
            setInterval(() => {
                events.forEach(event => {
                    const eventDate = new Date(`${event.date}T18:00:00`).getTime();
                    const now = new Date().getTime();
                    const distance = eventDate - now;

                    if (distance < 0) {
                        const el = document.getElementById(`timer-${event.id}`);
                        if (el) el.innerText = "🎉 Event Started!";
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    const el = document.getElementById(`timer-${event.id}`);
                    if (el) el.innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
                });
            }, 1000);
        }

        // --- BOOKING WITH 5-MIN COOLDOWN ---
        async function bookTicket() {
            const eventId = parseInt(document.getElementById('event-select').value);
            const userName = document.getElementById('booker-name').value;
            const userEmail = document.getElementById('booker-email').value;
            
            if(!eventId || !userName || !userEmail) return showToast('Please fill all fields', 'error');

            // 5-Minute Cooldown Logic (Per User)
            const lastBookingTime = localStorage.getItem(`lastBooking_${currentUser}`);
            const now = Date.now();
            const cooldownPeriod = 5 * 60 * 1000;

            if (lastBookingTime && (now - parseInt(lastBookingTime)) < cooldownPeriod) {
                showToast('Please wait 5 mins to book again', 'error');
                return;
            }

            const res = await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ eventId, userName, userEmail })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem(`lastBooking_${currentUser}`, now);
                showToast(`Success! Booked for ${data.data.eventName} 🎉`, 'success');
                loadEvents();
            } else {
                showToast(data.error || 'Booking failed', 'error');
            }
        }

        // --- ADMIN DASHBOARD ---
        async function loadAdminData() {
            const res = await fetch('/api/admin/bookings', { headers: { 'Authorization': `Bearer ${authToken}` } });
            const data = await res.json();
            
            if (res.ok) {
                let html = `<p style="margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 1.1rem;">
                    Total Bookings: <strong style="color: var(--accent-cyan); font-size: 1.3rem;">${data.totalBookings || 0}</strong>
                </p>`;
                if (data.data && data.data.length > 0) {
                    html += `<table>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Event</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Booked</th>
                        </tr>`;
                    data.data.forEach(b => {
                        const catClass = b.category ? `cat-${b.category.toLowerCase()}` : 'cat-default';
                        const bookedDate = b.bookedAt ? new Date(b.bookedAt).toLocaleDateString('en-US', { 
                            year: 'numeric', month: 'short', day: 'numeric' 
                        }) : 'N/A';
                        html += `<tr>
                            <td><strong>${b.userName || 'N/A'}</strong></td>
                            <td style="color: var(--text-secondary);">${b.userEmail || 'N/A'}</td>
                            <td>${b.eventName || 'N/A'}</td>
                            <td><span class="event-category ${catClass}">${b.category || 'General'}</span></td>
                            <td style="color: var(--accent-green); font-weight: 700;">$${b.price || 0}</td>
                            <td>${bookedDate}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                } else {
                    html += `<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">📭 No bookings yet.</p>`;
                }
                document.getElementById('admin-view').innerHTML = html;
            } else {
                showToast(data.error || 'Failed to load data', 'error');
            }
        }
    </script>
</body>
</html>
